[workspace]
members = [
    "crates/groove-common",
    "crates/groove-lfs",
    "crates/groove-init",
    "crates/groove-compositor",
    "crates/groove-session",
    "crates/groove-installer",
    "crates/groove-preload",
    "crates/groove-boostd",
    "crates/groove-cli",
    "crates/groove-bridged",
    "crates/groove-warmer",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

