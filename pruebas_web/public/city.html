uniform float uCoverCount[6];
vec3 toGroup(vec3 p){vec3 q=p-uGroupT;return vec3(dot(q,uGroupX),dot(q,uGroupY),dot(q,uGroupZ));}
vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}
vec3 dirToWorld(vec3 d){return d.x*uGroupX+d.y*uGroupY+d.z*uGroupZ;}
float coverOf(vec2 vb,float soft){float c=0.;for(int p=0;p<6;p++){float n=uCoverCount[p];float inside=-1e4;for(int e=0;e<10;e++){if(float(e)>=n)break;vec3 h=uCoverEdge[p*10+e];inside=max(inside,h.x*vb.x+h.y*vb.y+h.z);}if(n>0.)c=max(c,1.-smoothstep(-soft,soft,inside));}return c;}
`;

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}
vec3 from${name}(vec3 g){return ${prefix}T+g.x*${prefix}X+g.y*${prefix}Y+g.z*${prefix}Z;}
vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}
`;
}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;
  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}

const DATA = {"W":1000,"H":560,"P":{"origin":[500,359.50462862255415],"scale":0.8319058086021668,"azimuth":35,"elevation":40},"camera":{"origin":[500,359.50462862255415],"k":1.0522868615627774,"cam":[0.573576436351046,0.8191520442889918,0.6427876096865393,0.766044443118978]},"base":[-185,-110,185,110],"cloudZ":240,"buildings":[{"x0":-38,"y0":-75,"x1":14,"y1":-27,"z":127.5},{"x0":-145,"y0":-75,"x1":-107,"y1":-41,"z":40.5},{"x0":-95,"y0":-80,"x1":-53,"y1":-42,"z":56.5},{"x0":70,"y0":-75,"x1":145,"y1":-33,"z":34.5},{"x0":-130,"y0":35,"x1":-75,"y1":79,"z":30.5}]};
const canvas = document.querySelector(".city-gl");
const readout = document.querySelector("[data-readout]");
const cloudsGroup = document.querySelector('[data-part="clouds"]');
const car1 = document.querySelector(".car-1");
const car2 = document.querySelector(".car-2");

let rainLevel = 0.65;
let lampOn = 1.0;
let dayMode = 0.0; // 0.0: Noche cyberpunk neon, 1.0: Dia diáfano de maqueta
let flashTime = 0.0;
let carT = 0.0;
let cloudDrift = 0.0;

// SISTEMA DE GOTAS Y ONDAS DE IMPACTO
// Cada gota cae desde las nubes; al impactar el suelo o tejado, genera en ese punto exacto una onda
const MAX_DROPS = 48;
const MAX_RIPPLES = 48;
const drops = [];
const ripples = [];

for (let i = 0; i < MAX_DROPS; i++) {
  drops.push({
    x: DATA.base[0] + Math.random() * (DATA.base[2] - DATA.base[0]),
    y: DATA.base[1] + Math.random() * (DATA.base[3] - DATA.base[1]),
    z: DATA.cloudZ + Math.random() * 40,
    speed: 480 + Math.random() * 180,
    active: true
  });
}

function spawnRipple(x, y, z) {
  for (let i = 0; i < MAX_RIPPLES; i++) {
    const r = ripples[i];
    if (!r || r.age >= r.maxAge) {
      ripples[i] = { x, y, z, age: 0, maxAge: 0.65 + Math.random() * 0.25, maxRadius: 12 + Math.random() * 8 };
      break;
    }
  }
}

// Inicializar Canvas 2D de alta resolución para gotas y ondas proyectadas
const ctx = canvas.getContext("2d");

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  ctx.scale(dpr * (rect.width / DATA.W), dpr * (rect.height / DATA.H));
}
window.addEventListener("resize", resize);
resize();

// Proyección matemática 3D -> 2D con la matriz P
function project(x, y, z) {
  return iso([x, y, z], DATA.P);
}

let last = performance.now();

function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // 1. Animación suave de nubes flotantes
  cloudDrift = Math.sin(now * 0.0008) * 12;
  if (cloudsGroup) {
    cloudsGroup.setAttribute("transform", `translate(${cloudDrift.toFixed(1)} 0)`);
  }

  // 2. Animación de cochecitos circulando en bucle
  carT = (carT + dt * 0.22) % 1.0;
  if (car1) {
    const cx = DATA.base[0] + 40 + (DATA.base[2] - DATA.base[0] - 80) * ((carT * 2) % 1.0);
    car1.setAttribute("transform", translateAlong(DATA.P, [cx, 0, 0]));
  }

  // 3. Destello de relámpago
  if (flashTime > 0) {
    flashTime -= dt * 3.5;
  } else if (rainLevel > 0.75 && Math.random() < 0.004) {
    flashTime = 1.0;
  }

  // 4. Renderizado de lluvia y ondas en el lienzo
  ctx.clearRect(0, 0, DATA.W, DATA.H);

  // A. Actualizar y dibujar ondas concéntricas de impacto
  for (let i = 0; i < ripples.length; i++) {
    const r = ripples[i];
    if (!r || r.age >= r.maxAge) continue;
    r.age += dt;
    const progress = r.age / r.maxAge;
    const currentRadius = r.maxRadius * Math.sqrt(progress);
    const alpha = (1.0 - progress) * (rainLevel * 0.95);

    if (alpha <= 0.01) continue;

    const center2D = project(r.x, r.y, r.z);
    ctx.save();
    ctx.strokeStyle = dayMode > 0.5 ? `rgba(40, 120, 200, ${alpha})` : `rgba(0, 240, 255, ${alpha})`;
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    // Elipse isométrica orientada según los ejes
    ctx.ellipse(center2D[0], center2D[1], currentRadius, currentRadius * 0.58, -0.42, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // B. Actualizar y dibujar gotas descendentes desde las nubes
  const activeCount = Math.round(MAX_DROPS * rainLevel);
  for (let i = 0; i < activeCount; i++) {
    const d = drops[i];
    d.z -= d.speed * dt;
    d.x += dt * 18; // Viento sutil

    // Detección de impacto: altura del tejado o suelo
    let hitZ = 0;
    for (let b = 0; b < DATA.buildings.length; b++) {
      const bg = DATA.buildings[b];
      if (d.x >= bg.x0 && d.x <= bg.x1 && d.y >= bg.y0 && d.y <= bg.y1) {
        hitZ = bg.z;
        break;
      }
    }

    if (d.z <= hitZ) {
      // IMPACTO EXACTO: Detona onda concéntrica en ese punto
      spawnRipple(d.x, d.y, hitZ);

      // Reiniciar gota debajo de las nubes
      d.z = DATA.cloudZ + Math.random() * 25;
      d.x = DATA.base[0] + 15 + Math.random() * (DATA.base[2] - DATA.base[0] - 30);
      d.y = DATA.base[1] + 15 + Math.random() * (DATA.base[3] - DATA.base[1] - 30);
    }

    // Dibujar trazo lineal de la gota con paralaje isométrico
    const p1 = project(d.x, d.y, d.z);
    const p2 = project(d.x - 1.2, d.y, d.z + 9.0);

    ctx.save();
    ctx.strokeStyle = dayMode > 0.5 ? "rgba(100, 160, 220, 0.45)" : "rgba(180, 240, 255, 0.65)";
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.stroke();
    ctx.restore();
  }

  // C. Destello ambiental de tormenta
  if (flashTime > 0.05) {
    ctx.fillStyle = `rgba(220, 240, 255, ${flashTime * 0.22})`;
    ctx.fillRect(0, 0, DATA.W, DATA.H);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

// Control interactivo de telemetria
function updateTelemetry() {
  const mm = Math.round(rainLevel * 60);
  const status = rainLevel < 0.2 ? "Llovizna suave" : (rainLevel < 0.7 ? "Lluvia sostenida" : "Tormenta electrica");
  const modeStr = dayMode > 0.5 ? "Dia Diáfano" : "Noche Cyberpunk";
  const lampStr = lampOn > 0.5 ? "Farola: On" : "Farola: Off";
  const text = `Precipitacion: ${mm} mm/h // ${status} // ${modeStr} // ${lampStr}`;
  if (readout) readout.textContent = text;
}

window.setRain = function(val) {
  rainLevel = Math.max(0.0, Math.min(1.0, val));
  updateTelemetry();
};

window.toggleDayNight = function() {
  dayMode = dayMode > 0.5 ? 0.0 : 1.0;
  document.body.setAttribute("data-theme", dayMode > 0.5 ? "light" : "dark");
  updateTelemetry();
};

window.toggleLamp = function() {
  lampOn = lampOn > 0.5 ? 0.0 : 1.0;
  updateTelemetry();
};

window.triggerStorm = function() {
  flashTime = 1.0;
  rainLevel = 1.0;
  updateTelemetry();
};

updateTelemetry();
</script></body></html>
