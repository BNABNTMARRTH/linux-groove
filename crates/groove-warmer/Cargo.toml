[package]
name = "groove-warmer"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"

[[bin]]
name = "groove-warmer"
path = "src/main.rs"

[[bin]]
name = "groove-launch"
path = "src/bin/groove_launch.rs"


