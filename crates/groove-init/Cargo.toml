[package]
name = "groove-init"
version = "0.1.0"
edition = "2021"
description = "PID 1 Init y Supervisor de Servicios en Rust para Linux Groove OS"

[dependencies]
groove-common = { path = "../groove-common" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
nix = { version = "0.27", features = ["process", "signal", "mount", "sched"] }

