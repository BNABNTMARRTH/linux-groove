[core]
plugins = autostart command expo grid move resize place switcher vswitch cube scale animate blur alpha pixdecor wm-actions wrot foreign-toplevel wayfire-shell ipc ipc-rules
vwidth = 4
vheight = 1
preferred_decoration_mode = server
close_top_view = <alt> KEY_F4

[input]
xkb_layout = latam

[autostart]
autostart_wf_shell = false
shell = /usr/libexec/groove-wayfire-shell

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = /usr/libexec/groove-terminal
binding_files = <super> KEY_E
command_files = /usr/libexec/groove-files
binding_browser = <super> KEY_B
command_browser = /usr/libexec/groove-browser
binding_logout = <super> <shift> KEY_ESC
command_logout = /usr/libexec/groove-wayfire-logout

[move]
activate = <super> BTN_LEFT
[resize]
activate = <super> BTN_RIGHT
[wm-actions]
toggle_maximize = <super> KEY_UP
minimize = <super> KEY_DOWN
[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
[expo]
toggle = <super> KEY_SPACE
[scale]
toggle = <super> KEY_W
[cube]
activate = <ctrl> <alt> BTN_LEFT
rotate_left = <ctrl> <alt> KEY_LEFT
rotate_right = <ctrl> <alt> KEY_RIGHT
[wrot]
activate = <ctrl> <alt> BTN_RIGHT
[vswitch]
binding_left = <super> KEY_LEFT
binding_right = <super> KEY_RIGHT
duration = 180
[animate]
open_animation = zoom
close_animation = fade
duration = 160
[blur]
method = kawase
kawase_iterations = 3
kawase_offset = 2.0
blur_by_default = type is "toplevel" | type is "panel"
[pixdecor]
border_size = 1
fg_color = 0.125 0.141 0.169 1.0
bg_color = 0.102 0.114 0.137 1.0
fg_text_color = 0.96 0.94 0.90 1.0
bg_text_color = 0.58 0.64 0.72 1.0

overlay_engine = rounded_corners
rounded_corner_radius = 12
shadow_radius = 12
shadow_color = 0.0 0.0 0.0 0.22

[grid]
# Arrow keys belong to workspace navigation and wm-actions, not grid defaults.
slot_l = <super> KEY_KP4
slot_r = <super> KEY_KP6
slot_c = <super> KEY_KP5
restore = <super> KEY_KP0
duration = 160
