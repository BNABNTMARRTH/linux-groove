[background]
image = /usr/share/backgrounds/groove-piano-background-4k.png
fill_mode = fill_and_crop
randomize = false
[dock]
autohide = false
dock_height = 64
icon_height = 40
position = bottom
css_path = /etc/xdg/wayfire/dock.css

icon_mapping_thunar = /usr/share/icons/groove-glass/files.svg
icon_mapping_xfce4-terminal = /usr/share/icons/groove-glass/terminal.svg
icon_mapping_mousepad = /usr/share/icons/groove-glass/editor.svg
icon_mapping_firefox-default = /usr/share/icons/groove-glass/browser.svg
