<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido a Linux Groove OS</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 38, 0.72);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-warm: linear-gradient(135deg, #ffe629 0%, #ff9e00 52%, #ff4800 100%);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 20%, #161c2a 0%, #0b0e14 75%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      max-width: 840px;
      width: 100%;
      text-align: center;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .soundwave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 48px;
    }
    .bar {
      width: 7px;
      border-radius: 4px;
      background: var(--accent-warm);
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    .bar:nth-child(1) { height: 16px; animation-delay: 0.1s; }
    .bar:nth-child(2) { height: 28px; animation-delay: 0.25s; }
    .bar:nth-child(3) { height: 42px; animation-delay: 0.4s; }
    .bar:nth-child(4) { height: 32px; animation-delay: 0.2s; }
    .bar:nth-child(5) { height: 18px; animation-delay: 0.05s; }
    @keyframes pulse {
      0% { transform: scaleY(0.7); opacity: 0.8; }
      100% { transform: scaleY(1.15); opacity: 1; }
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--accent-warm);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1.15rem;
      margin-bottom: 30px;
    }
    .network-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 32px;
      transition: all 0.3s;
    }
    .network-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      padding: 12px 16px;
      outline: none;
    }
    .search-box button {
      background: var(--accent-warm);
      color: #0b0e14;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, opacity 0.2s;
    }
    .search-box button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 22px 16px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 158, 0, 0.45);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }
    .card-icon {
      font-size: 2rem;
    }
    .card-title {
      font-weight: 600;
      font-size: 1rem;
    }
    footer {
      margin-top: 48px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="soundwave">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <h1>Linux Groove OS</h1>
    </div>
    <p class="subtitle">Creative & Audio Operating System · The Blue Note Edition</p>

    <div id="netStatus" class="network-badge">
      <span id="netDot">●</span> <span id="netText">Comprobando conexión...</span>
    </div>

    <form class="search-box" action="https://duckduckgo.com/" method="GET" target="_blank">
      <input type="text" name="q" placeholder="Buscar en la web o ingresar una dirección..." autofocus required>
      <button type="submit">Buscar</button>
    </form>

    <div class="grid">
      <a class="card" href="https://duckduckgo.com/" target="_blank">
        <div class="card-icon">🦆</div>
        <div class="card-title">DuckDuckGo</div>
      </a>
      <a class="card" href="https://www.google.com" target="_blank">
        <div class="card-icon">🔍</div>
        <div class="card-title">Google</div>
      </a>
      <a class="card" href="https://www.youtube.com" target="_blank">
        <div class="card-icon">🎬</div>
        <div class="card-title">YouTube</div>
      </a>
      <a class="card" href="https://github.com" target="_blank">
        <div class="card-icon">🐙</div>
        <div class="card-title">GitHub</div>
      </a>
      <a class="card" href="https://es.wikipedia.org" target="_blank">
        <div class="card-icon">📖</div>
        <div class="card-title">Wikipedia</div>
      </a>
    </div>

    <footer>Linux Groove OS 0.3.0 · Arquitectura aarch64 (ARM64)</footer>
  </div>

  <script>
    function checkConnection() {
      const badge = document.getElementById('netStatus');
      const text = document.getElementById('netText');
      if (navigator.onLine) {
        badge.className = 'network-badge';
        text.textContent = 'Conectado a Internet';
      } else {
        badge.className = 'network-badge offline';
        text.textContent = 'Sin conexión a Internet';
      }
    }
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', checkConnection);
    checkConnection();
  </script>
</body>
</html>
