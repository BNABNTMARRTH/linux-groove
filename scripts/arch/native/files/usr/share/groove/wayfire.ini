[core]
plugins = autostart command decoration expo fast-switcher grid move place resize switcher vswitch window-rules wm-actions
preferred_decoration_mode = server
[autostart]
panel = wf-panel
background = wf-background
session = /usr/bin/groove-session-ready
[decoration]
font = Inter
[command]
binding_terminal = <super> KEY_ENTER
command_terminal = konsole
[wm-actions]
toggle_maximize = <super> KEY_UP
minimize = <super> KEY_DOWN
[vswitch]
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
